<!DOCTYPE html>
<html lang="en">
  <head>

    <title>Page not found · tinyslug</title>

      :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; background: #020617; color: #f1f5f9; }

      main { width: min(32rem, calc(100% - 2rem)); text-align: center; }
      .mark { display: grid; place-items: center; width: 3rem; height: 3rem; margin: auto; border-radius: .9rem; background: #bef264; color: #020617; font-size: 1.5rem; font-weight: 900; }
      .code { margin: 2rem 0 .5rem; color: #bef264; font-weight: 700; letter-spacing: .15em; }
      h1 { margin: 0; font-size: clamp(2rem, 7vw, 3.5rem); line-height: 1.05; }
      p { color: #94a3b8; line-height: 1.7; }
      a { display: inline-block; margin-top: 1rem; border-radius: .75rem; background: #bef264; padding: .8rem 1.1rem; color: #020617; font-weight: 700; text-decoration: none; }
      a:focus { outline: 3px solid #7dd3fc; outline-offset: 3px; }
    </style>
  </head>
  <body><main><div class="mark" aria-hidden="true">t</div><p class="code">404</p><h1>That link is tiny—or missing.</h1><p>The page, profile, or short link could not be found.</p><a href="/">Back to tinyslug</a></main></body>
